<div class="settings-overlay">
  <div class="settings-dialog">
    <div class="top-bar">
        <h2>{{ languageService.getTranslation('settings')() }}</h2>
        <div class="buttons">
            <button class="button-reset" (click)="resetQuarter.emit()">{{ translations.resetQuarter() }}</button>
            <button class="button-download" (click)="downloadCurrentLog()" [title]="translations.saveCurrentLogTitle()">{{ translations.downloadCurrentLog() }}</button>
        </div>
    </div>

    <div class="language-selector">
      <img src="https://flagcdn.com/w40/gb.png" (click)="setLanguage('en')" [class.active]="languageService.currentLanguage() === 'en'" alt="English">
      <img src="https://flagcdn.com/w40/hr.png" (click)="setLanguage('hr')" [class.active]="languageService.currentLanguage() === 'hr'" alt="Hrvatski">
    </div>

    <div class="settings-grid">
      <div class="form-group">
        <label>{{ translations.quarterDuration() }}</label>
        <input type="number" [(ngModel)]="editedSettings().quarterDuration">
      </div>
      <div class="form-group">
        <label>{{ translations.attackDuration() }}</label>
        <input type="number" [(ngModel)]="editedSettings().attackDuration">
      </div>
      <div class="form-group">
        <label>{{ translations.exclusionDuration() }}</label>
        <input type="number" [(ngModel)]="editedSettings().exclusionDuration">
      </div>
      <div class="form-group">
        <label>{{ translations.continuedAttackDuration() }}</label>
        <input type="number" [(ngModel)]="editedSettings().continuedAttackDuration">
      </div>
      <div class="form-group">
        <label>{{ translations.homeTeamNameLabel() }}</label>
        <input type="text" [(ngModel)]="homeTeamName">
      </div>
      <div class="form-group">
        <label>{{ translations.awayTeamNameLabel() }}</label>
        <input type="text" [(ngModel)]="awayTeamName">
      </div>

      <div class="recent-logs">
        <h3>{{ translations.recentLogs() }}</h3>
        @if (pastLogs().length > 0) {
          <ul>
            @for (log of pastLogs(); track log.id) {
              <li>
                <span [class.completed]="log.completed">{{ formatLog(log) }}</span>
                <button (click)="downloadLog(log)">{{ translations.download() }}</button>
              </li>
            }
          </ul>
        } @else {
          <p>{{ translations.noRecentLogs() }}</p>
        }
      </div>

      <div class="log-actions">
          <button class="button-clear-incomplete" (click)="clearIncompleteLogs()">{{ languageService.getTranslation('clearIncompleteLogs')() }}</button>
          <button class="button-clear-all" (click)="clearAllLogs()">{{ languageService.getTranslation('clearAllLogs')() }}</button>
          <button class="button-reset-all" (click)="onResetAllClick()">{{ languageService.getTranslation('resetAll')() }}</button>
      </div>
    </div>

    <div class="buttons">
      <button class="button-save" (click)="onSave()">{{ translations.save() }}</button>
      <button class="button-cancel" (click)="onClose()">{{ translations.cancel() }}</button>
    </div>
  </div>
</div>
